# Test suite on every PR / push to the long-lived branches. Also reused by the
# Publish workflow so a release can only be built from a green commit.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

env:
  # Run every JavaScript action on the Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -rA

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Compile the demo app
        run: uv run reflex compile
